name: CI

on:
  push:
    branches: [ master, github-action ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and release directly'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: build and verify both packages, but do not publish to npm or push the tag'
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    name: Test on node ${{ matrix.node_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # - windows-latest
        node_version: [ 12.x, 13.x, 14.x, 15.x, 16.x, 18.x, 19.x, 20.x, 21.x, 22.x ] # [6.x, 8.x, 10.x, 12.x, 14.x, 15.x, 16.x, 17.x, 18.x, 19.x, 20.x, 21.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node_version }}

    - name: Restore packages
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

    - name: Copy appropriate package.json
      run: |
        if [[ ${{ matrix.node_version }} == 12* ]]; then
          cp package-below-node-16.json package.json
        elif [[ ${{ matrix.node_version }} == 13* ]]; then
          cp package-below-node-16.json package.json
        elif [[ ${{ matrix.node_version }} == 14* ]]; then
          cp package-below-node-16.json package.json
        elif [[ ${{ matrix.node_version }} == 15* ]]; then
          cp package-below-node-16.json package.json
        elif [[ ${{ matrix.node_version }} == 16* ]]; then
          cp package-below-node-16.json package.json
        elif [[ ${{ matrix.node_version }} == 17* ]]; then
          cp package-below-node-16.json package.json
        elif [[ ${{ matrix.node_version }} == 19* ]]; then
          cp package-below-node-16.json package.json
        fi

    - name: yarn install, yarn test:coverage
      run: |
        yarn install
        yarn test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ runner.os }}

    - name: Notification
      if: always()
      id: slack
      uses: wingify/slack-github-action@v1.15.1-wingify
      with:
        channel-id: 'vwo-fs-fme-sdk-job-status' # 'fs-review-team'
        slack-message: "<!here> Node.js/JavaScript FME SDK Test on *Node-${{ matrix.node_version }}* and *${{ matrix.os }}* got *${{job.status}}* ${{job.status == 'success' && ':heavy_check_mark:' || ':x:'}} \nCommit: `${{github.event.head_commit.message}}`. \nCheck the latest build: https://github.com/wingify/vwo-fme-node-sdk/actions"
        color: "${{job.status == 'success' && '#00FF00' || '#FF0000'}}"
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}

  release:
    needs: build
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      (needs.build.result == 'success' || (github.event.inputs.skip_tests == 'true' && needs.build.result != 'cancelled'))
    name: Release to npm
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      HUSKY: 0
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run release script
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      run: bash ./scripts/release.sh
